services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: himeros
      POSTGRES_USER: himeros
      POSTGRES_PASSWORD: himeros_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himeros -d himeros"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/himeros
      SPRING_DATASOURCE_USERNAME: himeros
      SPRING_DATASOURCE_PASSWORD: himeros_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HIMEROS_SECURITY_JWT_SECRET: ${JWT_SECRET:-local-only-change-me-change-me-change-me}
      HIMEROS_SECURITY_COOKIE_SECURE: "false"
      HIMEROS_CORS_ALLOWED_ORIGINS: http://localhost:4200
      HIMEROS_MEDIA_DIRECTORY: /app/data/media
      HIMEROS_MEDIA_PUBLIC_BASE_URL: http://localhost:4200/media
    volumes: [media_data:/app/data/media]
    ports: ["8080:8080"]
    depends_on: [postgres, redis, kafka]

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
  media_data:
