spring:
  application:
    name: himeros-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/himeros}
    username: ${SPRING_DATASOURCE_USERNAME:himeros}
    password: ${SPRING_DATASOURCE_PASSWORD:himeros_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 18MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

himeros:
  security:
    jwt-secret: ${HIMEROS_SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-minutes: ${HIMEROS_SECURITY_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${HIMEROS_SECURITY_REFRESH_TOKEN_DAYS:30}
    cookie-secure: ${HIMEROS_SECURITY_COOKIE_SECURE:false}
    cookie-same-site: ${HIMEROS_SECURITY_COOKIE_SAME_SITE:Lax}
    cookie-domain: ${HIMEROS_SECURITY_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${HIMEROS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  media:
    directory: ${HIMEROS_MEDIA_DIRECTORY:./data/media}
    public-base-url: ${HIMEROS_MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media}
  outbox:
    fixed-delay-ms: ${HIMEROS_OUTBOX_FIXED_DELAY_MS:1000}
